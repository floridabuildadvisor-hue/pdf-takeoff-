name: Validate takeoff formulas

on:
  push:
    paths:
      - "vector_takeoff.py"
      - "framing_takeoff.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "vector_takeoff.py"
      - "framing_takeoff.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validation tests
        run: python -m unittest discover -s tests -v
